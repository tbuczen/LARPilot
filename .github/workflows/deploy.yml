name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Write .env.local and run make deploy on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          envs: PROJECT_DIR,APP_ENV,APP_SECRET,DATABASE_HOST,DATABASE_PORT,DATABASE_NAME,DATABASE_USER,DATABASE_PASSWORD,DATABASE_SERVER_VERSION,MAILER_DSN,OAUTH_GOOGLE_CLIENT_ID,OAUTH_GOOGLE_CLIENT_SECRET,OAUTH_FACEBOOK_CLIENT_ID,OAUTH_FACEBOOK_CLIENT_SECRET,OAUTH_DISCORD_CLIENT_ID,OAUTH_DISCORD_CLIENT_SECRET,GOOGLE_RECAPTCHA_SITE_KEY,GOOGLE_RECAPTCHA_SECRET,GOOGLE_API_KEY,GOOGLE_MAPS_API_KEY,GOOGLE_APP_ID,GOOGLE_SERVICE_EMAIL,GOOGLE_SERVICE_ACCOUNT_JSON,GH_TOKEN,GH_REPO,GH_DISCUSSION_CATEGORY_ID,OPENAI_API_KEY,OPENAI_EMBEDDING_MODEL,OPENAI_COMPLETION_MODEL,STORY_AI_AUTO_INDEX,VECTOR_STORE_DSN,SENTRY_DSN,SENTRY_RELEASE
          script: |
            set -e

            # A value pasted into a GitHub variable from a Windows editor
            # keeps its trailing carriage return, which then becomes part of
            # the path and makes cd fail with a confusing "No such file or
            # directory". Strip it rather than depend on how it was entered.
            PROJECT_DIR="$(printf '%s' "$PROJECT_DIR" | tr -d '\r')"

            if [ -z "$PROJECT_DIR" ]; then
              echo "PROJECT_DIR is not set. Add a 'PROJECT_DIR' variable (repo or 'prod' environment) pointing at the repository checkout on the server." >&2
              exit 1
            fi

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "PROJECT_DIR ($PROJECT_DIR) is not a git checkout. 'make deploy' starts with 'git pull', so the deploy directory has to be a clone of this repository." >&2
              exit 1
            fi

            cd "$PROJECT_DIR"

            DB_PORT="${DATABASE_PORT:-5432}"
            DB_SERVER_VERSION="${DATABASE_SERVER_VERSION:-16}"

            # The committed .env ships the Docker development defaults
            # (DATABASE_HOST=postgres). Anything not written to .env.local below
            # silently falls back to them, and the site then 500s on every page
            # that touches the database. Fail loudly instead.
            for required in DATABASE_HOST DATABASE_NAME DATABASE_USER DATABASE_PASSWORD; do
              eval "value=\$$required"
              if [ -z "$value" ]; then
                echo "$required is empty. Set it as a secret on the 'prod' environment, otherwise the deploy falls back to the development database settings in .env." >&2
                exit 1
              fi
            done

            if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
              cat > google-service-account.json <<SERVICEACCOUNTJSON
            $GOOGLE_SERVICE_ACCOUNT_JSON
            SERVICEACCOUNTJSON
              SERVICE_ACCOUNT_PATH="$PROJECT_DIR/google-service-account.json"
            fi

            # A dumped .env.local.php takes precedence over .env.local, so a
            # stale one would silently shadow everything written below.
            rm -f .env.local.php

            cat > .env.local <<ENVLOCAL
            APP_ENV=${APP_ENV:-prod}
            DATABASE_HOST=${DATABASE_HOST}
            DATABASE_PORT=${DB_PORT}
            DATABASE_NAME=${DATABASE_NAME}
            DATABASE_USER=${DATABASE_USER}
            DATABASE_PASSWORD=${DATABASE_PASSWORD}
            DATABASE_SERVER_VERSION=${DB_SERVER_VERSION}
            DATABASE_URL="postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DB_PORT}/${DATABASE_NAME}?serverVersion=${DB_SERVER_VERSION}&charset=utf8"
            MAILER_DSN=${MAILER_DSN:-null://null}
            OAUTH_GOOGLE_CLIENT_ID=$OAUTH_GOOGLE_CLIENT_ID
            OAUTH_GOOGLE_CLIENT_SECRET=$OAUTH_GOOGLE_CLIENT_SECRET
            OAUTH_FACEBOOK_CLIENT_ID=$OAUTH_FACEBOOK_CLIENT_ID
            OAUTH_FACEBOOK_CLIENT_SECRET=$OAUTH_FACEBOOK_CLIENT_SECRET
            OAUTH_DISCORD_CLIENT_ID=$OAUTH_DISCORD_CLIENT_ID
            OAUTH_DISCORD_CLIENT_SECRET=$OAUTH_DISCORD_CLIENT_SECRET
            GOOGLE_RECAPTCHA_SITE_KEY=$GOOGLE_RECAPTCHA_SITE_KEY
            GOOGLE_RECAPTCHA_SECRET=$GOOGLE_RECAPTCHA_SECRET
            GOOGLE_API_KEY=$GOOGLE_API_KEY
            GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
            GOOGLE_APP_ID=$GOOGLE_APP_ID
            GOOGLE_SERVICE_EMAIL=$GOOGLE_SERVICE_EMAIL
            GOOGLE_SERVICE_ACCOUNT_JSON=${SERVICE_ACCOUNT_PATH:-%kernel.project_dir%/google-service-account.json}
            GITHUB_TOKEN=$GH_TOKEN
            GITHUB_REPO=${GH_REPO:-tbuczen/LARPilot}
            GITHUB_DISCUSSION_CATEGORY_ID=$GH_DISCUSSION_CATEGORY_ID
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
            OPENAI_COMPLETION_MODEL=${OPENAI_COMPLETION_MODEL:-gpt-4o-mini}
            STORY_AI_AUTO_INDEX=${STORY_AI_AUTO_INDEX:-false}
            VECTOR_STORE_DSN=$VECTOR_STORE_DSN
            SENTRY_DSN=$SENTRY_DSN
            SENTRY_RELEASE=$SENTRY_RELEASE
            ENVLOCAL

            if [ -n "$APP_SECRET" ]; then
              echo "APP_SECRET=$APP_SECRET" >> .env.local
            fi

            mkdir -p var/cache var/log public/uploads
            chmod -R 775 var public/uploads

            # Symfony's Dotenv defaults to overrideExistingVars=false, so a
            # real (even empty) env var already present in this shell wins
            # over .env.local unconditionally — and this SSH session has all
            # of them injected. Export the resolved values so the console
            # commands make deploy runs see the same thing .env.local says.
            export DATABASE_SERVER_VERSION="$DB_SERVER_VERSION"
            export SENTRY_DSN="$SENTRY_DSN"
            export SENTRY_RELEASE="$SENTRY_RELEASE"

            make deploy
        env:
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_SERVER_VERSION: ${{ vars.DATABASE_SERVER_VERSION }}
          MAILER_DSN: ${{ secrets.MAILER_DSN }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_FACEBOOK_CLIENT_ID: ${{ secrets.OAUTH_FACEBOOK_CLIENT_ID }}
          OAUTH_FACEBOOK_CLIENT_SECRET: ${{ secrets.OAUTH_FACEBOOK_CLIENT_SECRET }}
          OAUTH_DISCORD_CLIENT_ID: ${{ secrets.OAUTH_DISCORD_CLIENT_ID }}
          OAUTH_DISCORD_CLIENT_SECRET: ${{ secrets.OAUTH_DISCORD_CLIENT_SECRET }}
          GOOGLE_RECAPTCHA_SITE_KEY: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
          GOOGLE_RECAPTCHA_SECRET: ${{ secrets.GOOGLE_RECAPTCHA_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          GOOGLE_SERVICE_EMAIL: ${{ secrets.GOOGLE_SERVICE_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_DISCUSSION_CATEGORY_ID: ${{ secrets.GH_DISCUSSION_CATEGORY_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_COMPLETION_MODEL: ${{ secrets.OPENAI_COMPLETION_MODEL }}
          STORY_AI_AUTO_INDEX: ${{ secrets.STORY_AI_AUTO_INDEX }}
          VECTOR_STORE_DSN: ${{ secrets.VECTOR_STORE_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
