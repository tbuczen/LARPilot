name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Run make deploy on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          envs: PROJECT_DIR
          script: |
            set -e

            # A value pasted into a GitHub variable from a Windows editor
            # keeps its trailing carriage return, which then becomes part of
            # the path and makes cd fail with a confusing "No such file or
            # directory". Strip it rather than depend on how it was entered.
            PROJECT_DIR="$(printf '%s' "$PROJECT_DIR" | tr -d '\r')"

            if [ -z "$PROJECT_DIR" ]; then
              echo "PROJECT_DIR is not set. Add a 'PROJECT_DIR' variable (repo or 'prod' environment) pointing at the repository checkout on the server." >&2
              exit 1
            fi

            cd "$PROJECT_DIR"
            make deploy
        env:
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
